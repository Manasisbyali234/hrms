<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetroMindz HRMS</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #e8eaf0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
      }

      /* ── Phone shell ── */
      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        background: #000;
        border-radius: 54px;
        box-shadow:
          0 0 0 2px #1a1a1a,
          0 0 0 6px #3a3a3a,
          0 30px 80px rgba(0,0,0,0.45);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
      }

      /* Dynamic Island */
      .island {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 36px;
        background: #000;
        border-radius: 20px;
        z-index: 10;
      }

      /* Side buttons */
      .phone::before {
        content: '';
        position: absolute;
        left: -8px;
        top: 160px;
        width: 5px;
        height: 44px;
        background: #3a3a3a;
        border-radius: 3px 0 0 3px;
        box-shadow: 0 56px 0 #3a3a3a, 0 108px 0 #3a3a3a;
      }
      .phone::after {
        content: '';
        position: absolute;
        right: -8px;
        top: 200px;
        width: 5px;
        height: 78px;
        background: #3a3a3a;
        border-radius: 0 3px 3px 0;
      }

      /* Screen area */
      .screen {
        flex: 1;
        border-radius: 46px;
        overflow: hidden;
        position: relative;
        background: #fff;
      }

      .screen iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      /* Home indicator bar */
      .home-bar {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 130px;
        height: 5px;
        background: rgba(255,255,255,0.35);
        border-radius: 3px;
        z-index: 10;
      }

      /* Responsive: show full-width on small screens */
      @media (max-width: 480px) {
        body { background: #fff; align-items: flex-start; }
        .phone {
          width: 100vw; height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
        .phone::before, .phone::after { display: none; }
        .screen { border-radius: 0; }
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <div id="root"></div>
      </div>
      <div class="home-bar"></div>
    </div>

  </body>
</html>
